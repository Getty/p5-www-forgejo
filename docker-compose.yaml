# Throwaway Forgejo instance for the live tests (t/9*-live-*.t).
# SQLite keeps it to a single small container; the port is bound to
# localhost only and sits outside the Kubernetes NodePort range
# (30000-32767). Start with: make -f Makefile.docker setup
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.7
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__PROTOCOL=http
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__ROOT_URL=http://localhost:13080/
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__admin__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=false
      # Off by default; on so the quota, nodeinfo/ActivityPub and repository
      # flags endpoints can be tested.
      - FORGEJO__quota__ENABLED=true
      - FORGEJO__federation__ENABLED=true
      - FORGEJO__repository__ENABLE_FLAGS=true
    ports:
      - "127.0.0.1:13080:3000"
    volumes:
      - forgejo_data:/data

volumes:
  forgejo_data:
